# Live location sharing with nginx's nchan module (https://nchan.io).
#
#   sudo apt install libnginx-mod-nchan
#
# 1. Put the two locations in the first part below inside the Compass server
#    block, before the generic "location /" block.
# 2. Add the internal server block from the second part, with "root" and
#    "fastcgi_pass" changed to match the Compass server block. It listens on
#    localhost only: anything that can reach it can post to a share, so never
#    expose it.
# 3. Set NCHAN_PUBLISH_URL=http://127.0.0.1:8090/pub in Compass's .env and
#    reload nginx.
#
# Nothing here depends on which address or port the Compass site itself
# listens on. If port 8090 is taken, change it in all three places.
#
# Without any of this Compass still works; shared maps then ask for the
# current location every few seconds.

# --- inside the Compass server block -----------------------------------------

    # Viewers of a share listen here (EventSource, WebSocket or long-polling)
    location ~ ^/share/live/([A-Za-z0-9]+)$ {
        nchan_subscriber;
        nchan_channel_id $1;
        # Ask Compass whether the share is still active before letting anyone listen
        nchan_authorize_request /nchan/authorize/$1;
        # Tell Compass a viewer arrived, so it can ask the device for a fresh location
        nchan_subscribe_request /nchan/viewer-connected/$1;
        # A new or reconnecting viewer starts with the most recent message
        nchan_subscriber_first_message -1;
    }

    # nchan's two callbacks above are passed on to the internal server below,
    # which hands them to Compass. They must not point straight at
    # /share/authorize in this server block: with nchan 1.3.7 on nginx 1.26, a
    # callback that goes through try_files into PHP crashes the nginx worker.
    location ~ ^/nchan/(authorize|viewer-connected)/([A-Za-z0-9]+)$ {
        internal;
        proxy_pass http://127.0.0.1:8090/share/$1?token=$2;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

# --- a separate server block ---------------------------------------------------

server {
    listen 127.0.0.1:8090;
    server_name localhost;

    # Compass posts new locations here, one channel per share token
    location ~ ^/pub/([A-Za-z0-9]+)$ {
        nchan_publisher;
        nchan_channel_id $1;
        nchan_message_buffer_length 50;
        nchan_message_timeout 6h;
    }

    # The two callbacks, handed to Compass. Use the same root and fastcgi_pass
    # as the Compass server block (and its APP_ENV, if it sets one).
    root /web/sites/compass.p3k.io/compass/public;
    location ~ ^/share/(authorize|viewer-connected)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.6-fpm.sock;
    }

    # Nothing else is served here
    location / { return 404; }
}
